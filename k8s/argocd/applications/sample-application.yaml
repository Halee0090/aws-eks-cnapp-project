apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: normal-app
  namespace: argocd
spec:
  project: aws-cnapp
  source:
    repoURL: <GITHUB_REPOSITORY_URL>
    targetRevision: main
    path: k8s/apps/normal-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
