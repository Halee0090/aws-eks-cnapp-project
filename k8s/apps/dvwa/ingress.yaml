apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dvwa
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /dvwa
            pathType: Prefix
            backend:
              service:
                name: dvwa
                port:
                  number: 80
